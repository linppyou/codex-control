# 复制为 /etc/codexctl/config.toml，只写需要改的项
# state_dir = "/var/lib/codexctl"
# key_file = "/etc/codexctl/master.key"
# codex_bin = "/opt/codex/bin/codex"
# min_uid = 1000
# refresh_interval_days = 4.0
# refresh_min_validity_days = 3.0
# quota_warn_percent = 80.0
# quota_crit_percent = 95.0
# 面板「用户」页隐藏的服务账号
# hidden_users = ["www", "mysql", "redis", "memcached"]
# 允许使用现有 Linux 密码登录面板的普通用户
# web_system_users = ["zdy", "wangcheng", "liyujie", "husongfa", "xxhmxw", "zhangshunhui", "xieshihao", "chenjunhao"]

# 创建用户时确保 codex 可用（缺失时自动安装）
# codex_wrapper = "/usr/local/bin/codex"
# codex_requirements = "/etc/codex/requirements.toml"
# codex_version = "0.167.0"
# 可改为国内镜像，支持 {version} 与 {arch}（x86_64 / aarch64）占位符
# codex_package_url = "https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-{arch}-unknown-linux-musl.tar.gz"
# codex_auto_install = true
# codex_install_timeout = 300.0
deployment_mode = "managed" # 纯网关主机使用 "gateway"
gateway_enabled = false
gateway_client_version = "0.167.0"
gateway_base_url = "https://codex-control.ppspace.xyz/v1"

# 为面板和 CLI 新建的 Linux 用户生成独立站点 SSH 密钥
# site_ssh_enabled = true
# 站点已授权此 CA 公钥时，为用户自动签发 SSH 证书
# site_ssh_ca_key = "/etc/codexctl/site-access-ca"

# 任务采集的公共浏览器环境，需允许各执行用户读取和执行
# dispatch_browser_python = "/opt/codexctl/browser-runtime/venv/bin/python"
# dispatch_chrome_binary = "/opt/codexctl/browser-runtime/chromium/chrome"
