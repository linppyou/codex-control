log_format codexctl_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time $sent_http_x_request_id';

map $http_upgrade $codexctl_connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    server_name codex-control.ppspace.xyz;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/codex-control.ppspace.xyz;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/codex-control.ppspace.xyz.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name codex-control.ppspace.xyz;

    ssl_certificate /www/server/panel/vhost/cert/codex-control.ppspace.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/codex-control.ppspace.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location = /v1 {
        rewrite ^ /v1/ last;
    }

    location ^~ /v1/ {
        client_max_body_size 16m;
        limit_req_dry_run on;
        limit_conn_dry_run on;
        proxy_pass http://unix:/run/codexctl/web.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codexctl_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;
        proxy_read_timeout 360s;
        access_log /www/wwwlogs/codex-control.ppspace.xyz-api.log codexctl_api;
    }

    location / {
        proxy_pass http://unix:/run/codexctl/web.sock;
        proxy_set_header Host $host;
        # 只传 nginx 看到的真实对端地址，覆盖客户端自带的值；不转发 X-Forwarded-For
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        # 首次创建用户可能触发 codex 自动安装，下载耗时较长
        proxy_read_timeout 300s;

        location = /skills/save {
            client_max_body_size 9m;
            proxy_pass http://unix:/run/codexctl/web.sock;
        }
    }

    access_log /www/wwwlogs/codex-control.ppspace.xyz.log;
}
