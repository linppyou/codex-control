server {
    listen 80;
    server_name codex-control.ppspace.xyz;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/codex-control.ppspace.xyz;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/codex-control.ppspace.xyz.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name codex-control.ppspace.xyz;

    ssl_certificate /www/server/panel/vhost/cert/codex-control.ppspace.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/codex-control.ppspace.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://unix:/run/codexctl/web.sock;
        proxy_set_header Host $host;
        # 只传 nginx 看到的真实对端地址，覆盖客户端自带的值；不转发 X-Forwarded-For
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    access_log /www/wwwlogs/codex-control.ppspace.xyz.log;
}
