<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ server.name }} · WP 建站中心</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/wp-center.js" defer></script>
</head>
<body class="wp-center-shell">
  <iframe id="wp-center-frame"
          title="{{ server.name }} · WP 建站中心"
          sandbox="allow-scripts allow-downloads"
          data-src="/servers/{{ server.id }}/wp-center/document{% if site_id %}?site_id={{ site_id|urlencode }}#maintenance{% endif %}"
          data-proxy="/servers/{{ server.id }}/wp-center/proxy"
          data-csrf="{{ csrf }}"></iframe>
</body>
</html>
