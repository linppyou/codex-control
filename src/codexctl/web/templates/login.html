{% extends "base.html" %}
{% block title %}登录 - codexctl{% endblock %}
{% block content %}
<div class="login-wrap">
<div class="card login">
  <div class="login-logo"><img src="/static/favicon.svg" alt=""><h1>codexctl 登录</h1></div>
  {% if login_err %}<div class="flash bad">{{ login_err }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ prelogin }}">
    <label>用户名 <input type="text" name="username" maxlength="64" autocomplete="username" required autofocus></label>
    <div class="login-password-field">
      <label for="login-password">密码</label>
      <div class="login-password-input">
        <input id="login-password" type="password" name="password" maxlength="1024" autocomplete="current-password" aria-describedby="caps-lock-status" required>
        <button type="button" class="password-toggle" id="toggle-password" aria-label="显示密码" title="显示密码" aria-controls="login-password" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="M3 3l18 18"/></svg>
        </button>
      </div>
    </div>
    <p id="caps-lock-status" class="hint" role="status" hidden>大写锁定已开启</p>
    <button type="submit" class="btn primary">登录</button>
  </form>
</div>
</div>
<script src="/static/login-form.js" defer></script>
{% endblock %}
